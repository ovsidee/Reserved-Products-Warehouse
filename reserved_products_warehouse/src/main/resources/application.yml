spring:
  application:
    name: reserved_products_warehouse
  datasource:
    url: jdbc:postgresql://localhost:5432/reserved_products_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8080