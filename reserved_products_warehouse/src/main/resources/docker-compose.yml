services:
  postgres:
    image: postgres:15-alpine
    container_name: reserved_products_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reserved_products_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: